[project]
name = "hearthagent-pro"
version = "0.1.0"
description = "Production-grade local-first AI agent with automatic model routing, memory tiers, and pluggable backends"
authors = [{name = "munikumar-pulikanti"}]
requires-python = ">=3.10"

dependencies = [
    "langgraph>=0.1.0",
    "langchain>=0.1.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.2.2",
    "ollama>=0.1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "boto3>=1.26.0",
    "requests>=2.31.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "langchain-ollama>=1.1.0",
    "langchain-core>=1.6.0",
    "ddgs>=9.16.0",
    "numpy>=2.2.6",
    "libsql-experimental>=0.0.55",
    "python-dotenv>=1.2.3",
    "streamlit>=1.62.0",
    "pandas>=2.3.3",
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5.6",
    "mcp<2",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
